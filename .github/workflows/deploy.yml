name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Testes unitários
        run: npm test -- --watch=false

      - name: Build de produção
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # Fallback de SPA: o GitHub Pages serve 404.html para rotas desconhecidas.
      - run: cp dist/site-forttiori/browser/index.html dist/site-forttiori/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master'
        with:
          path: dist/site-forttiori/browser

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
